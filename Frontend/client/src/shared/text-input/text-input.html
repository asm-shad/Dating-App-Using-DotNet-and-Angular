<label class="floating-label text-left">
    <span>
        {{label()}}
    </span>
    <input class="input w-full" [max]="maxDate()" [type]="type()" [class.input-error]="control.invalid && control.touched"
        [class.input-success]="control.valid && control.touched" [formControl]="control" placeholder="{{label()}}">
    @if(control.hasError('required') && control.touched){
    <div class="validation-hint text-error pt-2 text-xs">{{label()}} is required</div>
    }
    @if(control.hasError('email') && control.touched){
    <div class="validation-hint text-error pt-2 text-xs">Invalid Email Address</div>
    }
    @if(control.hasError('passwordMismatch') && control.touched){
    <div class="validation-hint text-error pt-2 text-xs">Passwords don't match</div>
    }
    @if(control.hasError('maxlength') && control.touched){
    <div class="validation-hint text-error pt-2 text-xs">Password must be shorter than
        {{control.errors?.['maxlength'].requiredLength}} characters</div>
    }
    @if(control.hasError('minlength') && control.touched){
    <div class="validation-hint text-error pt-2 text-xs">Password must be longer than
        {{control.errors?.['minlength'].requiredLength}} characters</div>
    }
</label>
